
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9303FC">
  <title>Abrindo publicação | Moozin</title>
  <meta name="description" content="Confira esta publicação no Moozin!">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100719;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #1d102b;
      border: 1px solid #49245f;
      border-radius: 24px;
      text-align: center;
    }

    .logo {
      font-size: 44px;
      font-weight: 900;
      color: #b95cff;
    }

    h1 {
      font-size: 23px;
      margin: 20px 0 12px;
    }

    p {
      color: #cbbbd6;
      line-height: 1.6;
      font-size: 15px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #49245f;
      border-top-color: #b95cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: block;
      padding: 15px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #9303FC;
      color: white;
    }

    .secondary {
      background: #342144;
      color: white;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">Moozin</div>

    <h1>Abrindo publicação...</h1>

    <div class="loader" id="loader"></div>

    <p id="message">
      Estamos tentando abrir esta publicação no aplicativo.
    </p>

    <a class="btn primary" id="openApp">
      Abrir no Moozin
    </a>

    <a class="btn secondary" id="downloadApp">
      Baixar na Google Play
    </a>
  </main>

  <script>
    // Captura o ID da publicação compartilhada.
    const params = new URLSearchParams(
      window.location.search
    );

    const postId = params.get("id");

    // Verifica se o ID é válido.
    const validId = postId && /^\d+$/.test(postId);

    // Pacote Android do Moozin.
    const packageName = "com.woozfans.app";

    // Endereço da Google Play.
    const playStore =
      "https://play.google.com/store/apps/details?id=" +
      packageName;

    const marketStore =
      "market://details?id=" + packageName;

    // Abre o FEED PRINCIPAL do Moozin.
    // Envia o ID para localizar o post original.
    const appLink = validId
      ? "woozin:///?postId=" + encodeURIComponent(postId)
      : "woozin:///";

    const openButton =
      document.getElementById("openApp");

    const downloadButton =
      document.getElementById("downloadApp");

    const message =
      document.getElementById("message");

    const isAndroid =
      /Android/i.test(navigator.userAgent);

    // Configura os botões.
    openButton.href = appLink;

    downloadButton.href = isAndroid
      ? marketStore
      : playStore;

    let appOpened = false;

    // Detecta quando o navegador vai para
    // segundo plano após abrir o aplicativo.
    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          appOpened = true;
        }
      }
    );

    window.addEventListener("pagehide", () => {
      appOpened = true;
    });

    // Tenta abrir o Moozin automaticamente.
    setTimeout(() => {
      window.location.href = appLink;
    }, 300);

    // Se o aplicativo não abrir,
    // tenta redirecionar para a Google Play.
    setTimeout(() => {
      if (!appOpened && !document.hidden) {
        message.textContent =
          "Redirecionando para a Google Play...";

        if (isAndroid) {
          window.location.href = marketStore;
        } else {
          window.location.replace(playStore);
        }
      }
    }, 2200);
  </script>
</body>
</html>
