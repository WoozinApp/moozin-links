
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9303FC">
  <title>Abrir no Moozin</title>
  <meta name="description" content="Confira este conteúdo no Moozin!">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100719;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #1d102b;
      border: 1px solid #49245f;
      border-radius: 24px;
      text-align: center;
    }

    .logo {
      font-size: 44px;
      font-weight: 900;
      color: #b95cff;
    }

    h1 {
      font-size: 23px;
      margin: 20px 0 12px;
    }

    p {
      color: #cbbbd6;
      line-height: 1.6;
      font-size: 15px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #49245f;
      border-top-color: #b95cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: block;
      padding: 15px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #9303FC;
      color: white;
    }

    .secondary {
      background: #342144;
      color: white;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">Moozin</div>

    <h1 id="title">Abrindo Moozin...</h1>

    <div class="loader" id="loader"></div>

    <p id="message">
      Estamos tentando abrir o aplicativo.
    </p>

    <a class="btn primary" id="openApp">
      Abrir no Moozin
    </a>

    <a class="btn secondary" id="downloadApp">
      Baixar na Google Play
    </a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    const postId = params.get("id");
    const perfilId = params.get("perfil");

    const validPost = postId !== null && /^\d+$/.test(postId);

    // IDs dos usuários no Supabase são UUIDs.
    const validPerfil = perfilId !== null &&
      /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(perfilId);

    const packageName = "com.woozfans.app";

    const playStore =
      "https://play.google.com/store/apps/details?id=" +
      packageName;

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const loader = document.getElementById("loader");
    const openButton = document.getElementById("openApp");
    const downloadButton = document.getElementById("downloadApp");

    let appLink = "woozin:///";
    let linkValido = false;

    if (validPerfil) {
      appLink = "woozin:///usuario/" +
        encodeURIComponent(perfilId);

      title.textContent = "Abrindo perfil...";
      message.textContent =
        "Estamos tentando abrir este perfil no Moozin.";
      linkValido = true;

    } else if (validPost) {
      appLink = "woozin:///comentarios?postId=" +
        encodeURIComponent(postId);

      title.textContent = "Abrindo publicação...";
      message.textContent =
        "Estamos tentando abrir esta publicação no Moozin.";
      linkValido = true;

    } else {
      title.textContent = "Link inválido";
      message.textContent =
        "Este link não contém uma publicação ou perfil válido.";
      loader.style.display = "none";
      openButton.style.display = "none";
    }

    openButton.href = appLink;

    if (isAndroid) {
      downloadButton.href = playStore;
      downloadButton.textContent = "Baixar na Google Play";
    } else if (isIOS) {
      // Atualizar quando tivermos o endereço oficial da App Store.
      downloadButton.style.display = "none";
    } else {
      downloadButton.href = playStore;
      downloadButton.textContent = "Ver na Google Play";
    }

    let appOpened = false;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) appOpened = true;
    });

    window.addEventListener("pagehide", () => {
      appOpened = true;
    });

    // Tenta abrir o aplicativo automaticamente.
    if (linkValido) {
      setTimeout(() => {
        window.location.href = appLink;
      }, 300);

      // Não deixa a animação carregando para sempre.
      setTimeout(() => {
        loader.style.display = "none";

        if (!appOpened && !document.hidden) {
          message.textContent =
            "Não abriu automaticamente? Toque em Abrir no Moozin.";
        }
      }, 2200);
    }
  </script>
</body>
</html>
