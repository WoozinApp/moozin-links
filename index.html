
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9303FC">
  <title>Abrindo Moozin...</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100719;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #1d102b;
      border: 1px solid #49245f;
      border-radius: 24px;
      text-align: center;
    }

    .logo {
      font-size: 44px;
      font-weight: 900;
      color: #b95cff;
    }

    h1 { font-size: 23px; }

    p {
      color: #cbbbd6;
      line-height: 1.6;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #49245f;
      border-top-color: #b95cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: block;
      padding: 16px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #9303FC;
      color: white;
    }

    .secondary {
      background: #342144;
      color: white;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">Moozin</div>

    <h1 id="title">Abrindo publicação...</h1>

    <div class="loader"></div>

    <p id="message">
      Tentando abrir o Moozin.
      Se não estiver instalado, abriremos a Google Play.
    </p>

    <a class="btn primary" id="openApp">
      Abrir no Moozin
    </a>

    <a class="btn secondary" id="downloadApp">
      Abrir Google Play
    </a>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const postId = params.get("id");
    const validId = postId && /^\d+$/.test(postId);

    const packageName = "com.woozfans.app";

    const playWeb =
      "https://play.google.com/store/apps/details?id=" +
      packageName;

    const playMarket =
      "market://details?id=" + packageName;

    const playIntent =
      "intent://details?id=" + packageName +
      "#Intent;scheme=market;" +
      "package=com.android.vending;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(playWeb) +
      ";end";

    const appLink = validId
      ? "woozin:///publicacao?id=" + encodeURIComponent(postId)
      : "woozin:///";

    const isAndroid = /Android/i.test(navigator.userAgent);

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const openApp = document.getElementById("openApp");
    const downloadApp = document.getElementById("downloadApp");

    openApp.href = appLink;
    downloadApp.href = isAndroid ? playMarket : playWeb;

    let leftPage = false;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) leftPage = true;
    });

    window.addEventListener("pagehide", () => {
      leftPage = true;
    });

    // Primeiro tenta abrir o aplicativo Moozin.
    setTimeout(() => {
      if (isAndroid) {
        location.href = appLink;
      }
    }, 300);

    // Depois de 5 segundos, tenta abrir
    // diretamente o aplicativo da Google Play.
    setTimeout(() => {
      if (leftPage || document.hidden) return;

      title.textContent = "Abrindo Google Play...";
      message.textContent =
        "Estamos redirecionando você para baixar o Moozin.";

      if (isAndroid) {
        location.href = playIntent;
      } else {
        location.href = playWeb;
      }
    }, 5000);

    // Alternativa manual caso o navegador bloqueie.
    downloadApp.addEventListener("click", (event) => {
      if (isAndroid) {
        event.preventDefault();
        location.href = playMarket;
      }
    });
  </script>
</body>
</html>
