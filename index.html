
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9303FC">
  <title>Publicação | Moozin</title>
  <meta name="description" content="Confira esta publicação no Moozin!">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100719;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #1d102b;
      border: 1px solid #49245f;
      border-radius: 24px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      color: #b95cff;
      margin-bottom: 12px;
    }

    h1 { font-size: 24px; margin: 12px 0; }

    p {
      color: #cbbbd6;
      line-height: 1.6;
      font-size: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
    }

    .primary { background: #9303FC; color: white; }
    .secondary { background: #342144; color: white; }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #9985a9;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">Moozin</div>

    <h1>Uma publicação espera por você!</h1>

    <p>
      Alguém compartilhou uma publicação do Moozin.
      Abra o aplicativo para conferir e participar da conversa.
    </p>

    <a class="btn primary" id="openApp" href="#">
      Abrir no Moozin
    </a>

    <a class="btn secondary" id="downloadApp" href="#">
      Baixar na Google Play
    </a>

    <div class="footer">
      Moozin — Social, Fashion e Fama
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    // Aceita somente IDs numéricos de publicações.
    const validId = postId && /^\d+$/.test(postId);

    const playStore =
      "https://play.google.com/store/apps/details?id=com.woozfans.app";

    const appLink = validId
      ? "woozin:///publicacao?id=" + encodeURIComponent(postId)
      : "woozin:///";

    document.getElementById("openApp").href = appLink;
    document.getElementById("downloadApp").href = playStore;

    if (!validId) {
      document.querySelector("h1").textContent =
        "Bem-vindo ao Moozin!";
      document.querySelector("p").textContent =
        "Conecte-se, compartilhe momentos e faça novas amizades.";
    }
  </script>
</body>
</html>
